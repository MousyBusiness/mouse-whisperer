# ============================================================================
# AGENT COMMANDS - Claude Code CLI slash commands and shortcuts
# (Trigger word is "agent" — "claude" doesn't transcribe reliably.)
# ============================================================================

[commands.agent]

[commands.agent.clear]
triggers = ["agent clear"]
description = "Run /clear in Claude Code and submit"
actions = [
  { method = "type_str", args = { text = "/clear" } },
  { method = "robotgo", args = { key = "enter" }, sleep = 100 },
]

[commands.agent.toggle]
triggers = ["agent toggle", "agent mode"]
description = "Toggle Claude Code modes (Shift+Tab)"
actions = [
  { method = "robotgo", args = { key = "tab", modifiers = [
    "shift",
  ] } },
]

[commands.agent.line]
triggers = ["agent line"]
description = "Insert newline in Claude Code input (Shift+Enter)"
actions = [
  { method = "robotgo", args = { key = "enter", modifiers = [
    "shift",
  ] } },
]

[commands.agent.compact]
triggers = ["agent compact"]
description = "Run /compact in Claude Code and submit"

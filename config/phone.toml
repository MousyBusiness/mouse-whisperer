# ============================================================================
# PHONE COMMANDS - Talon phonetic alphabet (spoken word -> single letter)
# Say the phonetic word to type the matching lowercase letter.
# disable_fuzzy keeps these 26 short triggers from grabbing each other or
# nearby words during normal dictation.
# ============================================================================
[commands.phone]

[commands.phone.air]
triggers = ["air"]
description = "Type letter a"
disable_fuzzy = true
actions = [{ method = "type_str", args = { text = "a" } }]


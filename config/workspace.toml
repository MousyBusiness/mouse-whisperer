# ============================================================================
# WORKSPACE COMMANDS - Mission Control space aliases and switching
# ============================================================================
# Requires build/space-helper (make space-helper). Aliases are in-memory and
# reset when the app restarts.
[commands.workspace]
[commands.workspace.alias]
triggers = ["alias workspace", "name workspace"]
description = "Alias the current space (e.g. 'alias workspace whatsapp')"
actions = [
  { method = "workspace_alias", args = { prompt = "A workspace name e.g. whatsapp, work, private. output: ", break = "750ms", timeout = "4s" } },
]

[commands.workspace.goto]
triggers = ["go to", "goto"]
description = "Switch to an aliased space (e.g. 'go to whatsapp')"
actions = [
  { method = "workspace_goto", args = { prompt = "An aliased workspace name. output: ", break = "750ms", timeout = "4s" } },
]

[commands.workspace.screen_one]
triggers = ["screen 1"]
description = "Switch to screen 1"
actions = [{ method = "workspace_goto_index", args = { index = 1 } }]

